name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-core:
    name: 核心算法测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试（vitest）
        run: npx vitest run

      - name: 批量比对（iztro对齐）
        run: npx tsx src/core/test-case/compare.ts

      - name: TypeScript类型检查
        run: npx tsc --noEmit

  build-web:
    name: 网页端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装网页依赖
        run: cd src/web-page && npm ci

      - name: 生产构建
        run: cd src/web-page && npm run build
